# Mock cho cả 10 domain service, JWKS của auth-user và collector OpenTelemetry.
# Một container phục vụ mọi tên host nhờ network alias trong docker-compose: mock chỉ cần
# đủ để Kong định tuyến, healthcheck và validate JWT — không mô phỏng nghiệp vụ.

server {
    listen 8080;
    server_name _;
    default_type application/json;

    # Vọng lại header actor mà Gateway gửi lên: đây là cách duy nhất kiểm bằng mắt rằng
    # header giả của client đã bị strip và header thật do taca-jwt đặt (SEC-GW-02).
    add_header X-Mock-Seen-User-Id "$http_x_user_id" always;
    add_header X-Mock-Seen-User-Roles "$http_x_user_roles" always;
    add_header X-Mock-Seen-Auth-Method "$http_x_auth_method" always;
    add_header X-Mock-Seen-Request-Id "$http_x_request_id" always;

    # Active healthcheck của mọi Upstream gọi đường này (LLD §5.2): bắt buộc nhẹ và
    # không phụ thuộc dependency nào.
    location = /health/live {
        return 200 '{"status":"UP","service":"mock-upstream","time":"2026-01-01T00:00:00Z"}';
    }

    # JWKS của auth-user; file do `make dev-keys` sinh, không commit vào Git.
    location = /.well-known/jwks.json {
        root /mock/jwks;
        try_files /jwks.json =503;
    }

    # Endpoint nhận trace của plugin opentelemetry; chỉ cần nuốt request.
    location = /v1/traces {
        return 204;
    }

    # Mọi route business khác: trả body hợp lệ để kiểm đường đi, không mô phỏng nghiệp vụ.
    location / {
        return 200 '{"data":[],"mock":true}';
    }
}
