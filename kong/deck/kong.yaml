# Declarative config của API Gateway — nguồn sự thật duy nhất cho Service/Route/Plugin/Upstream.
# Kong chạy DB-less nên file này thay thế hoàn toàn database: rollback = revert commit rồi sync lại.
#
# Quy ước bắt buộc (LLD §2.1.4, §2.3):
#   - Mỗi upstream tách hai Service: *-read (retries 1, chỉ GET/HEAD/OPTIONS) và *-write (retries 0).
#     retries là thuộc tính của Service chứ không phải Route, nên đây là cách duy nhất để
#     "chỉ retry GET" mà Kong hỗ trợ.
#   - strip_path: false trên mọi route business — service đích nhận nguyên /api/v1/...
#   - Không có route catch-all: path không khai báo thì Kong trả 404, đúng policy.
#
# Giá trị môi trường đến từ biến DECK_*; xem kong/deck/env/<môi trường>.yaml và Makefile.

_format_version: "3.0"

# ---------------------------------------------------------------------------
# Plugin toàn cục — áp cho mọi route trừ khi route khai báo instance riêng
# ---------------------------------------------------------------------------
plugins:
  # Sinh/giữ X-Request-ID ở đầu chuỗi access (LLD §2.2 bước 1). taca-request-guard
  # chạy ngay sau và thay giá trị bằng UUIDv7 nếu client gửi giá trị không hợp lệ.
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

  # PRIORITY 2100 — chạy trước cả cors (2000), vì cors của Kong trả 200 cho preflight
  # của origin lạ thay vì 403 (LLD §2.1.3, IT-KONG-14).
  - name: taca-request-guard
    config:
      mode: proxy
      allowed_origins:
        - ${{ env "DECK_CORS_ORIGIN_MFE_SHELL" }}
        - ${{ env "DECK_CORS_ORIGIN_MFE_BUYER" }}
        - ${{ env "DECK_CORS_ORIGIN_MFE_SELLER" }}
        - ${{ env "DECK_CORS_ORIGIN_MFE_ADMIN" }}
      request_id_header: X-Request-ID
      request_id_max_length: 64
      stripped_header_prefixes:
        - X-User-
        - X-Auth-
      # Rỗng = không tin X-Forwarded-* của bất kỳ ai. Môi trường có ingress thật khai báo
      # dải proxy ở đây và ở trusted_ips của kong.conf.
      trusted_proxy_cidrs: []
      service_name: api-gateway

  # origins phải khớp từng dòng với taca-request-guard.allowed_origins ở trên: hai danh
  # sách lệch nhau là lỗ hổng hoặc chặn nhầm frontend (LLD §8 #16, IT-KONG-15).
  - name: cors
    config:
      origins:
        - ${{ env "DECK_CORS_ORIGIN_MFE_SHELL" }}
        - ${{ env "DECK_CORS_ORIGIN_MFE_BUYER" }}
        - ${{ env "DECK_CORS_ORIGIN_MFE_SELLER" }}
        - ${{ env "DECK_CORS_ORIGIN_MFE_ADMIN" }}
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: [Authorization, Content-Type, X-Request-ID, Idempotency-Key]
      max_age: 600
      # Baseline dùng Bearer header, không dùng cookie; bật credentials sẽ kéo theo
      # ràng buộc CSRF chưa được chốt (LLD §4, API §5 #4).
      credentials: false
      preflight_continue: false

  - name: request-size-limiting
    config:
      allowed_payload_size: 1
      size_unit: megabytes
      require_content_length: false

  # Lớp cuối cùng nhìn thấy response. redis_backed_rate_limit=true vì mọi route business
  # đều có rate-limiting dùng Redis; ba route vận hành khai báo lại thành false.
  - name: taca-error-envelope
    config:
      allowed_business_error_codes: []
      redis_backed_rate_limit: true

  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

  - name: opentelemetry
    config:
      traces_endpoint: ${{ env "DECK_OTEL_TRACES_ENDPOINT" }}
      # W3C traceparent để trace nối được xuyên suốt sang service đích (LLD §2.5).
      header_type: w3c
      resource_attributes:
        service.name: api-gateway

  # Log có cấu trúc + redaction tại chỗ. Access log của nginx đã tắt trong kong.conf vì
  # nó không redact được ?access_token= trong URI (SEC-GW-12).
  - name: file-log
    config:
      path: /dev/stdout
      reopen: false
      custom_fields_by_lua:
        # Trả về nil để xoá hẳn field khỏi bản ghi log.
        request.headers.authorization: "return nil"
        request.headers.cookie: "return nil"
        request.headers[\"sec-websocket-protocol\"]: "return nil"
        response.headers[\"set-cookie\"]: "return nil"
        request.url: "local url = kong.request.get_path_with_query() return (url:gsub('access_token=[^&]*', 'access_token=[REDACTED]'))"

# ---------------------------------------------------------------------------
# Upstream — mỗi domain service một upstream, target lấy từ biến môi trường
# ---------------------------------------------------------------------------
# Circuit breaker của thiết kế được thực thi bằng healthcheck của Kong (LLD §5.2):
#   passive.unhealthy  ~ CIRCUIT_FAILURE_THRESHOLD (5 lỗi) → target bị eject  ~ OPEN
#   active.healthy     ~ CIRCUIT_OPEN_DURATION (30s probe) → target trở lại   ~ HALF_OPEN → CLOSED
#
# LỆCH ĐÃ BIẾT (LLD §8 #15): passive healthcheck của Kong đếm lỗi LIÊN TIẾP, không theo
# cửa sổ 30s như CIRCUIT_WINDOW. Traffic thành công/thất bại xen kẽ có thể không bao giờ
# chạm ngưỡng. Đây là ngữ nghĩa của Kong OSS, đã chấp nhận, không mô phỏng thêm.
#
# 429 cố ý KHÔNG nằm trong unhealthy.http_statuses (mặc định của Kong có): 429 là câu trả
# lời hợp lệ của service, đếm nó sẽ eject target ngay giữa đợt traffic cao.
upstreams:
  # Auth/user/profile/address/shop-profile/KYC
  - name: up-auth-user
    slots: 10000
    healthchecks:
      passive:
        type: http
        healthy:
          successes: 1
        unhealthy:
          http_failures: 5
          timeouts: 5
          tcp_failures: 5
          http_statuses: [500, 502, 503, 504]
      active:
        type: http
        http_path: /health/live
        timeout: 2
        concurrency: 4
        healthy:
          interval: 30
          successes: 1
          http_statuses: [200]
        unhealthy:
          interval: 10
          http_failures: 3
          timeouts: 3
          tcp_failures: 3
          http_statuses: [429, 500, 502, 503, 504]
    targets:
      - target: ${{ env "DECK_AUTH_USER_TARGET" }}
        weight: 100

  # Catalog SPU/SKU, category, shop products
