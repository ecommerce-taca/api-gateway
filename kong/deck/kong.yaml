        # AUTHENTICATED_RATE_LIMIT — 300 req/phút/user
        - name: rate-limiting
          config:
            minute: 300
            policy: redis
            limit_by: header
            header_name: X-User-ID
            # fault_tolerant mặc định của Kong là true (cho request đi qua khi Redis lỗi),
            # vi phạm policy fail-closed §3.6 — phải để false.
            fault_tolerant: false
            hide_client_headers: false
            redis:
              host: ${{ env "DECK_REDIS_HOST" }}
              port: ${{ env "DECK_REDIS_PORT" }}
              database: ${{ env "DECK_REDIS_DATABASE" }}
              timeout: 500
        - name: taca-jwt
          config:
            issuer: ${{ env "DECK_JWT_ISSUER" }}
            audience: ${{ env "DECK_JWT_AUDIENCE" }}
            jwks_uri: ${{ env "DECK_JWT_JWKS_URI" }}
            allowed_algorithms: [RS256]
            clock_skew_seconds: 30
            jwks_ttl_seconds: 600
            jwks_max_stale_seconds: 1800
            token_required: true
            revocation_check_enabled: true
            redis:
              host: ${{ env "DECK_REDIS_HOST" }}
              port: ${{ env "DECK_REDIS_PORT" }}
              database: ${{ env "DECK_REDIS_DATABASE" }}
              timeout_ms: 500

  # message, đường đọc REST
  - name: svc-message-read
    host: up-message
    port: 80
    protocol: http
    retries: 1
    connect_timeout: 2000
    read_timeout: 5000
    write_timeout: 5000
    routes:
      # Family 18 — REST là source of truth khi client reconnect (LLD §3.9)
      - name: rt-message-read
        paths: ["/api/v1/conversations", "/api/v1/messages", "/api/v1/attachments"]
        methods: [GET, HEAD, OPTIONS]
        strip_path: false
        preserve_host: false
        plugins:
        # AUTHENTICATED_RATE_LIMIT — 300 req/phút/user
        - name: rate-limiting
          config:
            minute: 300
            policy: redis
            limit_by: header
            header_name: X-User-ID
            # fault_tolerant mặc định của Kong là true (cho request đi qua khi Redis lỗi),
            # vi phạm policy fail-closed §3.6 — phải để false.
            fault_tolerant: false
            hide_client_headers: false
            redis:
              host: ${{ env "DECK_REDIS_HOST" }}
              port: ${{ env "DECK_REDIS_PORT" }}
              database: ${{ env "DECK_REDIS_DATABASE" }}
              timeout: 500
        - name: taca-jwt
          config:
            issuer: ${{ env "DECK_JWT_ISSUER" }}
            audience: ${{ env "DECK_JWT_AUDIENCE" }}
            jwks_uri: ${{ env "DECK_JWT_JWKS_URI" }}
            allowed_algorithms: [RS256]
            clock_skew_seconds: 30
            jwks_ttl_seconds: 600
            jwks_max_stale_seconds: 1800
            token_required: true
            revocation_check_enabled: true
            redis:
              host: ${{ env "DECK_REDIS_HOST" }}
              port: ${{ env "DECK_REDIS_PORT" }}
              database: ${{ env "DECK_REDIS_DATABASE" }}
              timeout_ms: 500

  # message, đường ghi REST
  - name: svc-message-write
    host: up-message
    port: 80
    protocol: http
    retries: 0
    connect_timeout: 2000
    read_timeout: 5000
    write_timeout: 5000
    routes:
      # Family 18 — gửi message, tạo conversation, metadata attachment
      - name: rt-message-write
        paths: ["/api/v1/conversations", "/api/v1/messages", "/api/v1/attachments"]
        methods: [POST, PUT, PATCH, DELETE]
        strip_path: false
        preserve_host: false
        plugins:
        # AUTHENTICATED_RATE_LIMIT — 300 req/phút/user
        - name: rate-limiting
          config:
            minute: 300
            policy: redis
            limit_by: header
            header_name: X-User-ID
            # fault_tolerant mặc định của Kong là true (cho request đi qua khi Redis lỗi),
            # vi phạm policy fail-closed §3.6 — phải để false.
            fault_tolerant: false
            hide_client_headers: false
            redis:
              host: ${{ env "DECK_REDIS_HOST" }}
              port: ${{ env "DECK_REDIS_PORT" }}
              database: ${{ env "DECK_REDIS_DATABASE" }}
              timeout: 500
        - name: taca-jwt
          config:
            issuer: ${{ env "DECK_JWT_ISSUER" }}
            audience: ${{ env "DECK_JWT_AUDIENCE" }}
            jwks_uri: ${{ env "DECK_JWT_JWKS_URI" }}
            allowed_algorithms: [RS256]
            clock_skew_seconds: 30
            jwks_ttl_seconds: 600
            jwks_max_stale_seconds: 1800
            token_required: true
            revocation_check_enabled: true
            redis:
              host: ${{ env "DECK_REDIS_HOST" }}
              port: ${{ env "DECK_REDIS_PORT" }}
              database: ${{ env "DECK_REDIS_DATABASE" }}
              timeout_ms: 500

  # message, tunnel WebSocket. retries 0: handshake không bao giờ được retry. connect_timeout = WS_HANDSHAKE_TIMEOUT 5s, read_timeout = WS_IDLE_TIMEOUT 1800s. Tuyệt đối không gắn plugin đọc/ghi body lên route này (LLD §3.9)
  - name: svc-message-ws
    host: up-message
    port: 80
    protocol: http
    retries: 0
    connect_timeout: 5000
    read_timeout: 1800000
    write_timeout: 1800000
    routes:
      # Family 19 — path WebSocket duy nhất được upgrade; mọi /ws/** khác không có Route nên trả 404
      - name: rt-message-ws
        paths: ["/ws/messages"]
        methods: [GET]
        strip_path: false
        preserve_host: false
        plugins:
        # AUTHENTICATED_RATE_LIMIT — 300 req/phút/user
        - name: rate-limiting
          config:
            minute: 300
            policy: redis
            limit_by: header
            header_name: X-User-ID
            # fault_tolerant mặc định của Kong là true (cho request đi qua khi Redis lỗi),
            # vi phạm policy fail-closed §3.6 — phải để false.
            fault_tolerant: false
            hide_client_headers: false
            redis:
              host: ${{ env "DECK_REDIS_HOST" }}
              port: ${{ env "DECK_REDIS_PORT" }}
              database: ${{ env "DECK_REDIS_DATABASE" }}
              timeout: 500
        - name: taca-jwt
          config:
            issuer: ${{ env "DECK_JWT_ISSUER" }}
            audience: ${{ env "DECK_JWT_AUDIENCE" }}
            jwks_uri: ${{ env "DECK_JWT_JWKS_URI" }}
            allowed_algorithms: [RS256]
            clock_skew_seconds: 30
            jwks_ttl_seconds: 600
            jwks_max_stale_seconds: 1800
            token_required: true
            accept_websocket_subprotocol: true
            accept_query_token: true
            revocation_check_enabled: true
            redis:
              host: ${{ env "DECK_REDIS_HOST" }}
              port: ${{ env "DECK_REDIS_PORT" }}
              database: ${{ env "DECK_REDIS_DATABASE" }}
              timeout_ms: 500
        - name: taca-ws-guard
          config:
            max_connections_per_user: 10
            # TTL dài hơn WS_IDLE_TIMEOUT (1800s) để counter không hết hạn khi socket còn
            # mở, và vẫn tự dọn nếu node chết trước khi phase log chạy (DB §3.1.2).
            connection_counter_ttl_seconds: 3600
            redis:
              host: ${{ env "DECK_REDIS_HOST" }}
              port: ${{ env "DECK_REDIS_PORT" }}
              database: ${{ env "DECK_REDIS_DATABASE" }}
              timeout_ms: 500

  # Endpoint vận hành. Nguồn thật là status listener của chính node (kong.conf
  # status_listen 0.0.0.0:8100), expose lại dưới path contract qua Route nội bộ (LLD §2.1.5).
  # Admin API :8001 chỉ bind loopback và không có Route nào trỏ tới (SEC-GW-14).
  - name: svc-kong-status
    host: 127.0.0.1
    port: 8100
    protocol: http
    path: /status
    retries: 0
    connect_timeout: 2000
    read_timeout: 5000
    write_timeout: 5000
    routes:
      # Liveness: taca-request-guard chế độ liveness dịch body /status của Kong sang
      # contract {status, service, time} của API §3.1.
      - name: rt-ops-health-live
        paths: ["/health/live"]
        methods: [GET]
        strip_path: true
        preserve_host: false
        plugins:
          - name: taca-request-guard
            config:
              mode: liveness
              service_name: api-gateway
          # Ba route vận hành tự sinh body của mình; cờ redis ở instance toàn cục không
          # đúng ở đây vì các route này không có rate-limiting.
          - name: taca-error-envelope
            config:
              redis_backed_rate_limit: false

      # Readiness: plugin tự kiểm config/JWKS/Redis/upstream rồi thoát ngay ở phase access,
      # nên upstream status listener không bị gọi (LLD §2.1.5, API §3.2).
      - name: rt-ops-health-ready
        paths: ["/health/ready"]
        methods: [GET]
        strip_path: true
        preserve_host: false
        plugins:
          - name: taca-request-guard
            config:
              mode: readiness
              service_name: api-gateway
              jwks:
                jwks_uri: ${{ env "DECK_JWT_JWKS_URI" }}
                jwks_shared_dict: taca_jwks
                lock_shared_dict: taca_locks
                jwks_ttl_seconds: 600
                jwks_max_stale_seconds: 1800
                jwks_request_timeout_ms: 2000
              redis:
                host: ${{ env "DECK_REDIS_HOST" }}
                port: ${{ env "DECK_REDIS_PORT" }}
                database: ${{ env "DECK_REDIS_DATABASE" }}
                timeout_ms: 500
          - name: taca-error-envelope
            config:
              redis_backed_rate_limit: false

  # /metrics do plugin prometheus sinh trên status listener; taca-request-guard chế độ
  # metrics nối thêm các counter custom không có tương đương native (API §3.3).
  - name: svc-kong-metrics
    host: 127.0.0.1
    port: 8100
    protocol: http
    path: /metrics
    retries: 0
    connect_timeout: 2000
    read_timeout: 5000
    write_timeout: 5000
    routes:
      - name: rt-ops-metrics
        paths: ["/metrics"]
        methods: [GET]
        strip_path: true
        preserve_host: false
        plugins:
          - name: taca-request-guard
            config:
              mode: metrics
              service_name: api-gateway
          - name: taca-error-envelope
            config:
              redis_backed_rate_limit: false
