# ---------------------------------------------------------------------------
# Service và Route
# ---------------------------------------------------------------------------
services:

  # auth-user, đường đọc — retries 1 vì GET/HEAD idempotent (LLD §2.1.4)
  - name: svc-auth-user-read
    host: up-auth-user
    port: 80
    protocol: http
    retries: 1
    connect_timeout: 2000
    read_timeout: 5000
    write_timeout: 5000
    routes:
      # Family 1 — /auth: public tuỳ endpoint. Token là tuỳ chọn để endpoint protected (signout/2FA) vẫn nhận actor context; danh sách endpoint chính xác thuộc API spec của auth-user (API §5 #1)
      - name: rt-auth-user-auth-read
        paths: ["/api/v1/auth"]
        methods: [GET, HEAD, OPTIONS]
        strip_path: false
        preserve_host: false
        plugins:
        # AUTH_RATE_LIMIT — 10 req/phút/IP cho signup/signin/OTP/reset
        - name: rate-limiting
          config:
            minute: 10
            policy: redis
            limit_by: ip
            # fault_tolerant mặc định của Kong là true (cho request đi qua khi Redis lỗi),
            # vi phạm policy fail-closed §3.6 — phải để false.
            fault_tolerant: false
            hide_client_headers: false
            redis:
              host: ${{ env "DECK_REDIS_HOST" }}
              port: ${{ env "DECK_REDIS_PORT" }}
              database: ${{ env "DECK_REDIS_DATABASE" }}
              timeout: 500
        - name: taca-jwt
          config:
            issuer: ${{ env "DECK_JWT_ISSUER" }}
            audience: ${{ env "DECK_JWT_AUDIENCE" }}
            jwks_uri: ${{ env "DECK_JWT_JWKS_URI" }}
            allowed_algorithms: [RS256]
            clock_skew_seconds: 30
            jwks_ttl_seconds: 600
            jwks_max_stale_seconds: 1800
            token_required: false
            revocation_check_enabled: true
            redis:
              host: ${{ env "DECK_REDIS_HOST" }}
              port: ${{ env "DECK_REDIS_PORT" }}
              database: ${{ env "DECK_REDIS_DATABASE" }}
              timeout_ms: 500
      # Family 2 — profile/address/favorites/following: bắt buộc JWT
      - name: rt-auth-user-account-read
        paths: ["/api/v1/users", "/api/v1/addresses"]
        methods: [GET, HEAD, OPTIONS]
        strip_path: false
        preserve_host: false
        plugins:
        # AUTHENTICATED_RATE_LIMIT — 300 req/phút/user
        - name: rate-limiting
          config:
            minute: 300
            policy: redis
            limit_by: header
            header_name: X-User-ID
            # fault_tolerant mặc định của Kong là true (cho request đi qua khi Redis lỗi),
            # vi phạm policy fail-closed §3.6 — phải để false.
            fault_tolerant: false
            hide_client_headers: false
            redis:
              host: ${{ env "DECK_REDIS_HOST" }}
              port: ${{ env "DECK_REDIS_PORT" }}
              database: ${{ env "DECK_REDIS_DATABASE" }}
              timeout: 500
        - name: taca-jwt
          config:
            issuer: ${{ env "DECK_JWT_ISSUER" }}
            audience: ${{ env "DECK_JWT_AUDIENCE" }}
            jwks_uri: ${{ env "DECK_JWT_JWKS_URI" }}
            allowed_algorithms: [RS256]
            clock_skew_seconds: 30
            jwks_ttl_seconds: 600
            jwks_max_stale_seconds: 1800
            token_required: true
            revocation_check_enabled: true
            redis:
              host: ${{ env "DECK_REDIS_HOST" }}
              port: ${{ env "DECK_REDIS_PORT" }}
              database: ${{ env "DECK_REDIS_DATABASE" }}
              timeout_ms: 500
      # Family 3 — seller onboarding/shop
      - name: rt-auth-user-seller-account-read
        paths: ["/api/v1/seller/onboarding", "/api/v1/seller/shop"]
        methods: [GET, HEAD, OPTIONS]
        strip_path: false
        preserve_host: false
        plugins:
        # AUTHENTICATED_RATE_LIMIT — 300 req/phút/user
        - name: rate-limiting
          config:
            minute: 300
            policy: redis
            limit_by: header
            header_name: X-User-ID
            # fault_tolerant mặc định của Kong là true (cho request đi qua khi Redis lỗi),
            # vi phạm policy fail-closed §3.6 — phải để false.
            fault_tolerant: false
            hide_client_headers: false
            redis:
              host: ${{ env "DECK_REDIS_HOST" }}
              port: ${{ env "DECK_REDIS_PORT" }}
              database: ${{ env "DECK_REDIS_DATABASE" }}
              timeout: 500
        - name: taca-jwt
          config:
            issuer: ${{ env "DECK_JWT_ISSUER" }}
            audience: ${{ env "DECK_JWT_AUDIENCE" }}
            jwks_uri: ${{ env "DECK_JWT_JWKS_URI" }}
            allowed_algorithms: [RS256]
            clock_skew_seconds: 30
            jwks_ttl_seconds: 600
            jwks_max_stale_seconds: 1800
            token_required: true
            revocation_check_enabled: true
            redis:
              host: ${{ env "DECK_REDIS_HOST" }}
              port: ${{ env "DECK_REDIS_PORT" }}
              database: ${{ env "DECK_REDIS_DATABASE" }}
              timeout_ms: 500
        - name: taca-rbac
          config:
            required_roles: [SELLER, SELLER_STAFF]
            required_any_permission: []
      # Family 4 — admin user/KYC: coarse gate theo role admin quản trị người dùng; permission chi tiết và 2FA do auth-user enforce (IT-GW-18/19)
      - name: rt-auth-user-admin-read
        paths: ["/api/v1/admin/users", "/api/v1/admin/shops"]
        methods: [GET, HEAD, OPTIONS]
        strip_path: false
        preserve_host: false
        plugins:
        # AUTHENTICATED_RATE_LIMIT — 300 req/phút/user
        - name: rate-limiting
          config:
            minute: 300
            policy: redis
            limit_by: header
            header_name: X-User-ID
            # fault_tolerant mặc định của Kong là true (cho request đi qua khi Redis lỗi),
            # vi phạm policy fail-closed §3.6 — phải để false.
            fault_tolerant: false
            hide_client_headers: false
            redis:
              host: ${{ env "DECK_REDIS_HOST" }}
              port: ${{ env "DECK_REDIS_PORT" }}
              database: ${{ env "DECK_REDIS_DATABASE" }}
              timeout: 500
        - name: taca-jwt
          config:
            issuer: ${{ env "DECK_JWT_ISSUER" }}
            audience: ${{ env "DECK_JWT_AUDIENCE" }}
            jwks_uri: ${{ env "DECK_JWT_JWKS_URI" }}
            allowed_algorithms: [RS256]
            clock_skew_seconds: 30
            jwks_ttl_seconds: 600
            jwks_max_stale_seconds: 1800
            token_required: true
            revocation_check_enabled: true
            redis:
              host: ${{ env "DECK_REDIS_HOST" }}
              port: ${{ env "DECK_REDIS_PORT" }}
              database: ${{ env "DECK_REDIS_DATABASE" }}
              timeout_ms: 500
        - name: taca-rbac
          config:
            required_roles: [ADMIN, RISK_MANAGER]
            required_any_permission: []
      # Family 5 — GET /shops/{id} công khai
      - name: rt-auth-user-shop-profile-read
        paths: ["~/api/v1/shops/[^/]+$"]
        methods: [GET, HEAD, OPTIONS]
        strip_path: false
        preserve_host: false
        regex_priority: 10
        plugins:
        # PUBLIC_RATE_LIMIT — 120 req/phút/IP
        - name: rate-limiting
          config:
            minute: 120
            policy: redis
            limit_by: ip
            # fault_tolerant mặc định của Kong là true (cho request đi qua khi Redis lỗi),
            # vi phạm policy fail-closed §3.6 — phải để false.
            fault_tolerant: false
            hide_client_headers: false
            redis:
              host: ${{ env "DECK_REDIS_HOST" }}
              port: ${{ env "DECK_REDIS_PORT" }}
              database: ${{ env "DECK_REDIS_DATABASE" }}
              timeout: 500
      # Family 5 — đếm follower công khai (API §1.4)
      - name: rt-auth-user-shop-followers-read
        paths: ["~/api/v1/shops/[^/]+/followers/count$"]
        methods: [GET, HEAD, OPTIONS]
        strip_path: false
        preserve_host: false
        regex_priority: 40
        plugins:
        # PUBLIC_RATE_LIMIT — 120 req/phút/IP
        - name: rate-limiting
          config:
            minute: 120
            policy: redis
            limit_by: ip
            # fault_tolerant mặc định của Kong là true (cho request đi qua khi Redis lỗi),
            # vi phạm policy fail-closed §3.6 — phải để false.
            fault_tolerant: false
            hide_client_headers: false
            redis:
              host: ${{ env "DECK_REDIS_HOST" }}
              port: ${{ env "DECK_REDIS_PORT" }}
              database: ${{ env "DECK_REDIS_DATABASE" }}
              timeout: 500
      # Family 5 — trạng thái follow của chính user
      - name: rt-auth-user-shop-follow-read
        paths: ["~/api/v1/shops/[^/]+/follow$"]
        methods: [GET, HEAD, OPTIONS]
        strip_path: false
        preserve_host: false
        regex_priority: 40
        plugins:
        # AUTHENTICATED_RATE_LIMIT — 300 req/phút/user
        - name: rate-limiting
          config:
            minute: 300
            policy: redis
            limit_by: header
            header_name: X-User-ID
            # fault_tolerant mặc định của Kong là true (cho request đi qua khi Redis lỗi),
            # vi phạm policy fail-closed §3.6 — phải để false.
            fault_tolerant: false
            hide_client_headers: false
            redis:
