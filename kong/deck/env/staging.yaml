# Giá trị môi trường staging.
# Tên biến map sang §2.6 của LLD: DECK_<SERVICE>_TARGET = host:port của <SERVICE>_BASE_URL.
# decK chỉ đọc biến môi trường có tiền tố DECK_; Makefile nạp file này thành env trước khi gọi deck.

# LƯU Ý: các giá trị dưới đây là tên host nội bộ mẫu theo LLD §2.6, KHÔNG phải địa chỉ thật.
# Địa chỉ thật, Redis password và JWKS URI của môi trường này do DevOps nạp qua biến môi
# trường của CI/secret manager và ghi đè file này lúc chạy — không commit vào Git (DB §7 #3).
DECK_AUTH_USER_TARGET: auth-user.internal:8080
DECK_PRODUCT_CATALOG_TARGET: product-catalog.internal:8080
DECK_SEARCH_TARGET: search.internal:8080
DECK_ORDER_COMMERCE_TARGET: order-commerce.internal:8080
DECK_INVENTORY_TARGET: inventory.internal:8080
DECK_PAYMENT_WALLET_TARGET: payment-wallet.internal:8080
DECK_SHIPMENT_TARGET: shipment.internal:8080
DECK_RATING_COMMENT_TARGET: rating-comment.internal:8080
DECK_NOTIFICATION_TARGET: notification.internal:8080
DECK_MESSAGE_TARGET: message.internal:8080

DECK_REDIS_HOST: redis.internal
DECK_REDIS_PORT: 6379
DECK_REDIS_DATABASE: 0

DECK_JWT_ISSUER: http://auth-user.internal:8080
DECK_JWT_AUDIENCE: taca-marketplace-api
DECK_JWT_JWKS_URI: http://auth-user.internal:8080/.well-known/jwks.json

DECK_CORS_ORIGIN_MFE_SHELL: https://shell.staging.example
DECK_CORS_ORIGIN_MFE_BUYER: https://buyer.staging.example
DECK_CORS_ORIGIN_MFE_SELLER: https://seller.staging.example
DECK_CORS_ORIGIN_MFE_ADMIN: https://admin.staging.example

DECK_OTEL_TRACES_ENDPOINT: http://otel-collector.internal:8080/v1/traces
