- hash_fallback: none
  hash_on: none
  hash_on_cookie_path: /
  healthchecks:
    active:
      concurrency: 4
      healthy:
        http_statuses:
        - 200
        interval: 30
        successes: 1
      http_path: /health/live
      timeout: 2
      type: http
      unhealthy:
        http_failures: 3
        http_statuses:
        - 429
        - 500
        - 502
        - 503
        - 504
        interval: 10
        tcp_failures: 3
        timeouts: 3
    passive:
      healthy:
        http_statuses:
        - 200
        - 201
        - 202
        - 203
        - 204
        - 205
        - 206
        - 207
        - 208
        - 226
        - 300
        - 301
        - 302
        - 303
        - 304
        - 305
        - 306
        - 307
        - 308
        successes: 1
      type: http
      unhealthy:
        http_failures: 5
        http_statuses:
        - 500
        - 502
        - 503
        - 504
        tcp_failures: 5
        timeouts: 5
