_format_version: "3.0"
plugins:
- config:
    echo_downstream: true
    generator: uuid
    header_name: X-Request-ID
  name: correlation-id
- config:
    credentials: false
    headers:
    - Authorization
    - Content-Type
    - X-Request-ID
    - Idempotency-Key
    max_age: 600
    methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
    origins:
    - https://shell.staging.example
    - https://buyer.staging.example
    - https://seller.staging.example
    - https://admin.staging.example
    preflight_continue: false
  name: cors
- config:
    custom_fields_by_lua:
      request.headers.authorization: return nil
      request.headers.cookie: return nil
      request.headers[\"sec-websocket-protocol\"]: return nil
      request.url: local url = kong.request.get_path_with_query() return (url:gsub('access_token=[^&]*',
        'access_token=[REDACTED]'))
      response.headers[\"set-cookie\"]: return nil
    path: /dev/stdout
    reopen: false
  name: file-log
- config:
    header_type: w3c
    resource_attributes:
      service.name: api-gateway
    traces_endpoint: http://otel-collector.internal:8080/v1/traces
  name: opentelemetry
- config:
    bandwidth_metrics: true
    latency_metrics: true
    status_code_metrics: true
    upstream_health_metrics: true
  name: prometheus
- config:
    allowed_payload_size: 1
    require_content_length: false
    size_unit: megabytes
  name: request-size-limiting
- config:
    allowed_business_error_codes: []
    redis_backed_rate_limit: true
  name: taca-error-envelope
- config:
    allowed_origins:
    - https://shell.staging.example
    - https://buyer.staging.example
    - https://seller.staging.example
    - https://admin.staging.example
    mode: proxy
    request_id_header: X-Request-ID
    request_id_max_length: 64
    service_name: api-gateway
    stripped_header_prefixes:
    - X-User-
    - X-Auth-
    trusted_proxy_cidrs: []
  name: taca-request-guard
services:
- connect_timeout: 2000
  host: up-auth-user
  name: svc-auth-user-read
  port: 80
  protocol: http
  read_timeout: 5000
  retries: 1
  routes:
  - methods:
    - GET
    - HEAD
    - OPTIONS
    name: rt-auth-user-account-read
    paths:
    - /api/v1/users
    - /api/v1/addresses
    plugins:
    - config:
        fault_tolerant: false
        header_name: X-User-ID
        hide_client_headers: false
        limit_by: header
        minute: 300
        policy: redis
        redis:
          database: 0
          host: redis.internal
          port: 6379
          timeout: 500
      name: rate-limiting
    - config:
        allowed_algorithms:
        - RS256
        audience: taca-marketplace-api
        clock_skew_seconds: 30
        issuer: http://auth-user.internal:8080
        jwks_max_stale_seconds: 1800
        jwks_ttl_seconds: 600
        jwks_uri: http://auth-user.internal:8080/.well-known/jwks.json
        redis:
          database: 0
          host: redis.internal
          port: 6379
          timeout_ms: 500
        revocation_check_enabled: true
        token_required: true
      name: taca-jwt
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    strip_path: false
  - methods:
    - GET
    - HEAD
    - OPTIONS
    name: rt-auth-user-admin-read
    paths:
    - /api/v1/admin/users
    - /api/v1/admin/shops
    plugins:
    - config:
        fault_tolerant: false
