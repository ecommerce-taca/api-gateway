      name: taca-error-envelope
    - config:
        mode: liveness
        service_name: api-gateway
      name: taca-request-guard
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    strip_path: true
  - methods:
    - GET
    name: rt-ops-health-ready
    paths:
    - /health/ready
    plugins:
    - config:
        redis_backed_rate_limit: false
      name: taca-error-envelope
    - config:
        jwks:
          jwks_max_stale_seconds: 1800
          jwks_request_timeout_ms: 2000
          jwks_shared_dict: taca_jwks
          jwks_ttl_seconds: 600
          jwks_uri: http://auth-user.internal:8080/.well-known/jwks.json
          lock_shared_dict: taca_locks
        mode: readiness
        redis:
          database: 0
          host: redis.internal
          port: 6379
          timeout_ms: 500
        service_name: api-gateway
      name: taca-request-guard
