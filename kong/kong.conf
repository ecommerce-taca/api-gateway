# Kong Gateway 3.9.0 OSS — cấu hình node cho API Gateway (LLD §2.1)
# Mọi giá trị ở đây là cấu hình *node*; Service/Route/Plugin/Upstream nằm ở kong/deck/kong.yaml.

# ---- Chế độ chạy ----
# DB-less là quyết định kiến trúc (LLD §2.1): route static, không đọc từ database,
# rollback bằng revert commit config chứ không rollback schema.
database = off
declarative_config = /kong/declarative/kong.yaml

# ---- Plugin ----
# 5 plugin custom phải khai báo tường minh; thiếu tên ở đây thì decK sync sẽ báo plugin không tồn tại.
plugins = bundled,taca-request-guard,taca-jwt,taca-rbac,taca-ws-guard,taca-error-envelope
lua_package_path = /usr/local/custom/?.lua;/usr/local/custom/?/init.lua;;

# ---- Listener ----
proxy_listen = 0.0.0.0:8000 reuseport backlog=16384, 0.0.0.0:8443 http2 ssl reuseport backlog=16384
# Admin API chỉ bind loopback: DB-less nên nó read-only, nhưng vẫn lộ toàn bộ topology
# nếu mở ra ingress (LLD §2.1.5, SEC-GW-14). decK sync phải chạy qua port-forward/exec vào node.
admin_listen = 127.0.0.1:8001
# Status listener là nguồn thật của /health/live (LLD §2.1.5); không chứa dữ liệu nhạy cảm.
status_listen = 0.0.0.0:8100

# ---- Header đối ngoại ----
# Tắt toàn bộ header do Kong tự thêm (Server, X-Kong-Upstream-Latency, X-Kong-Proxy-Latency):
# SEC-GW-15 cấm lộ thông tin runtime của Kong ra client.
headers = off

# ---- Giới hạn request ----
# MAX_HEADER_SIZE = 16 KiB (LLD §4). Body limit do plugin request-size-limiting đảm nhiệm.
nginx_http_large_client_header_buffers = 4 16k

# ---- Retry ----
# Chỉ retry khi lỗi kết nối/timeout. Không thêm http_500/non_idempotent — nếu thêm,
# nginx sẽ retry cả mutation và phá policy "không retry write" (LLD §3.5).
nginx_proxy_proxy_next_upstream = error timeout

# ---- Shared dict của custom plugin ----
# Kong chỉ nhận một directive lua_shared_dict qua config key này; các dict sau được nối bằng ';'
# và render thành directive độc lập trong nginx-kong.conf (đã kiểm chứng trên 3.9.0).
#   taca_jwks    — cache public key theo kid, TTL 10m/stale 30m (LLD §2.4, DB §3.2)
#   taca_locks   — resty.lock cho refresh JWKS một lần khi gặp kid lạ (LLD §2.4 bước 3)
#   taca_metrics — counter custom không có tương đương native của Kong (API §3.3)
nginx_http_lua_shared_dict = taca_jwks 10m; lua_shared_dict taca_locks 1m; lua_shared_dict taca_metrics 5m

# ---- Client IP ----
# Để trống trusted_ips nghĩa là Kong KHÔNG tin X-Forwarded-For và dùng IP kết nối trực tiếp.
# Đây là mặc định an toàn cho rate limit theo IP (LLD §2.5); môi trường có ingress thật
# phải set dải proxy qua biến KONG_TRUSTED_IPS, không sửa file này.
trusted_ips =
real_ip_header = X-Forwarded-For
real_ip_recursive = on

# ---- Log ----
# Access log của nginx bị tắt: URI có thể chứa ?access_token= (WS handshake) và nginx
# không redact được. Log có cấu trúc + redaction do plugin file-log/http-log đảm nhiệm (SEC-GW-12).
proxy_access_log = off
proxy_error_log = /dev/stderr
admin_access_log = off
admin_error_log = /dev/stderr
status_access_log = off
status_error_log = /dev/stderr
log_level = notice

# ---- Runtime ----
nginx_worker_processes = auto
