# Môi trường local cho API Gateway. KHÔNG dùng làm cấu hình production.
#
# Điều kiện chạy: `make up` ở thư mục gốc — nó render kong.yaml sang
# kong/deck/.build/kong.dev.yaml và sinh khoá dev cho JWKS mock trước khi gọi compose.
# Chạy `docker compose up` trực tiếp khi chưa render sẽ thiếu file config.
#
# Hai node Kong là cố ý: rate limit phân tán và trạng thái healthcheck per-node chỉ lộ ra
# khi có từ hai node trở lên (test doc §1.1).

name: taca-api-gateway

services:
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [gateway]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  # Một container đóng vai cả 10 domain service, JWKS của auth-user và OTEL collector.
  # Alias mạng làm mọi tên host trong kong.yaml phân giải về đây.
  mock-upstreams:
    image: nginx:1.27.3-alpine
    volumes:
      - ./mocks/nginx/upstream-mock.conf:/etc/nginx/conf.d/default.conf:ro
      - ./mocks/jwks:/mock/jwks:ro
    networks:
      gateway:
        aliases:
          - mock-auth-user
          - mock-product-catalog
          - mock-search
          - mock-order-commerce
          - mock-inventory
          - mock-payment-wallet
          - mock-shipment
          - mock-rating-comment
          - mock-notification
          - mock-message
          - mock-otel-collector
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  kong-node-1:
    build:
      context: .
      target: runtime
    depends_on:
      redis:
        condition: service_healthy
      mock-upstreams:
        condition: service_healthy
    environment:
      # DEV-ONLY: mở Admin API trên mạng nội bộ Docker để Konga quan sát (read-only).
      # Kong chạy DB-less nên Admin API vẫn chỉ đọc. kong.conf giữ loopback cho production;
      # override này chỉ nằm trong compose local và KHÔNG publish 8001 ra host (SEC-GW-14).
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong/deck/.build/kong.dev.yaml:/kong/declarative/kong.yaml:ro
    networks: [gateway]
    ports:
      - "127.0.0.1:8000:8000"
      # Status listener chỉ bind loopback của host: nó là endpoint vận hành, không phải
      # public API. Admin API :8001 không được publish ở bất kỳ môi trường nào (SEC-GW-14).
      - "127.0.0.1:8100:8100"

  kong-node-2:
    build:
      context: .
      target: runtime
    depends_on:
      redis:
        condition: service_healthy
      mock-upstreams:
        condition: service_healthy
    environment:
      # DEV-ONLY: giống kong-node-1 — chỉ để Konga quan sát qua mạng nội bộ, không publish 8001.
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong/deck/.build/kong.dev.yaml:/kong/declarative/kong.yaml:ro
    networks: [gateway]
    ports:
      - "127.0.0.1:8010:8000"
      - "127.0.0.1:8110:8100"

  # GUI quan sát cấu hình Kong (read-only, phần phụ — không thuộc thiết kế gốc).
  # Konga kết nối Admin API :8001 của kong-node-1 qua mạng nội bộ. Konga 0.14.9 bắt buộc
  # có database riêng (adapter `local` đã bị bỏ), nên kèm MySQL 5.7 bên dưới — Kong
  # vẫn DB-less, không đổi gì. Kong DB-less → Admin API chỉ đọc → Konga chỉ XEM, không sửa.
  # Lưu ý: image pantsel/konga (0.14.9, 2021) không còn được bảo trì; chỉ dùng ở local.
  konga:
    image: pantsel/konga:0.14.9
    depends_on:
      konga-db:
        condition: service_healthy
      kong-node-1:
        condition: service_started
      kong-node-2:
        condition: service_started
    environment:
      NODE_ENV: production
      DB_ADAPTER: mysql
      DB_HOST: konga-db
      DB_PORT: 3306
      DB_USER: konga
      DB_PASSWORD: konga
      DB_DATABASE: konga
    # Tự chạy `prepare` (tạo schema + seed) trước khi nâng app, để `make up` trên máy mới
    # không dính lỗi "konga_users doesn't exist". prepare là idempotent (create-if-not-exists).
    # Image có ENTRYPOINT=/app/start.sh nên phải override sang sh -c mới chạy được chuỗi lệnh.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "/app/start.sh -c prepare -a mysql -u mysql://konga:konga@konga-db:3306/konga && node --harmony /app/app.js"
    networks: [gateway]
    ports:
      - "127.0.0.1:1337:1337"

  # MySQL chỉ phục vụ Konga (lưu tài khoản + connection của Konga), không liên quan Kong.
  # Dùng MySQL 5.7 vì Konga 0.14.9 (2021) bó driver pg cũ không hợp Postgres hiện đại.
  konga-db:
    image: mysql:5.7
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: konga
      MYSQL_DATABASE: konga
      MYSQL_USER: konga
      MYSQL_PASSWORD: konga
    volumes:
      - konga-db-data:/var/lib/mysql
    networks: [gateway]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ukonga", "-pkonga"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  gateway:
    name: taca-gateway

volumes:
  redis-data:
    name: taca-gateway-redis-data
  konga-db-data:
    name: taca-gateway-konga-db-data
